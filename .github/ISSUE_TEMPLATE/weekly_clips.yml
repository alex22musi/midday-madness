name: Weekly clips
description: Checklist for turning a show into clips on the site
title: "[Clips] "
labels:
  - area:clips
  - type:chore
body:
  - type: input
    id: date
    attributes:
      label: Episode date
      placeholder: "2026-11-11"
    validations:
      required: true
  - type: textarea
    id: moments
    attributes:
      label: Candidate moments
      description: "Timestamp (M:SS) + punchy title for each of the 3–4 candidates. 30–60 sec, one clear take."
    validations:
      required: true
  - type: checkboxes
    id: steps
    attributes:
      label: Checklist
      description: Full process lives in the wiki's Clip Workflow page.
      options:
        - label: Thumbnails designed first in Canva (1080×1920, navy/gold, byline below the logo), 2–3 variations per clip
        - label: Audio cut, clip rendered 720p faststart (target 2–5 MB), poster JPG under 150 KB
        - label: "Files named `clip-YYYY-MM-DD-slug.mp4` / `.jpg` in `assets/clips/`"
        - label: "`data/clips.json` entry added — startSec matches timestampLabel"
        - label: "`node scripts/ci/check-site.cjs` passes"
        - label: '"Watch in episode" jump lands on the exact second'
        - label: Large media committed one file per commit
